[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vae-project"
version = "0.1.0"
authors = [
    {name = "Ángel Ramos", email = "aramosortiz8@gmail.com"},
]
description = "This repository is part of my Bachelor's thesis in Mathematics, focused on Variational Autoencoders and probabilistic machine learning. It contains the model implementation in PyTorch and a variety of practical applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy==2.3.2",
    "matplotlib==3.10.3",
    "pandas==2.3.1",
    "Pillow==11.3.0",
    "seaborn==0.13.2",
    "scikit-learn==1.7.0",
    "scikit-image==0.25.2"
]

[project.urls]
Homepage = "https://github.com/angelr-code/vae-project"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]